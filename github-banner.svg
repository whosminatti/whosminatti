<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Leandro, Senior DevOps Engineer: terraform plan e painel de SLO" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Leandro, Senior DevOps Engineer</title>
  <style>
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .t { font-size: 14px; fill: #D6DEEB; white-space: pre; }
    .d { fill: #6F7E9C; }
    .g { fill: #7FD99A; }
    .b { fill: #7DB4FF; }
    .a { fill: #F2B84B; }
    .w { font-weight: 700; }
    .lbl { font-size: 12px; fill: #7A88A6; }
    .val { font-size: 20px; fill: #D6DEEB; font-weight: 700; }

    .l { opacity: 0; animation: show .01s forwards; }
    @keyframes show { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .spark { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 2.2s ease-out 4.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .dot { opacity: 0; animation: show .01s forwards 6.4s; }

    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s ease-out 5s forwards; }
    @keyframes grow { to { transform: scaleX(1); } }

    @media (prefers-reduced-motion: reduce) {
      .l, .dot { animation: none; opacity: 1; }
      .spark { animation: none; stroke-dashoffset: 0; }
      .bar { animation: none; transform: none; }
      .cursor { animation: none; }
    }
  </style>

  <rect width="1280" height="460" fill="#0F1623"/>

  <!-- Terminal -->
  <rect x="40" y="40" width="780" height="380" rx="12" fill="#151D2E" stroke="#26324A"/>
  <path d="M40 76H820" stroke="#26324A"/>
  <circle cx="64" cy="58" r="6" fill="#26324A"/>
  <circle cx="84" cy="58" r="6" fill="#26324A"/>
  <circle cx="104" cy="58" r="6" fill="#26324A"/>
  <text x="430" y="63" text-anchor="middle" class="mono lbl">leandro@platform: ~/infra</text>

  <g class="mono t">
    <text class="l" style="animation-delay:.4s" x="72" y="110"><tspan class="g">$</tspan> terraform plan</text>
    <text class="l" style="animation-delay:.9s" x="72" y="132"><tspan class="d">  # engineer.leandro will be created</tspan></text>
    <text class="l" style="animation-delay:1.3s" x="72" y="154"><tspan class="g">  +</tspan> resource "engineer" "leandro" {</text>
    <text class="l" style="animation-delay:1.7s" x="72" y="176"><tspan class="g">      +</tspan> role  = <tspan class="a">"Senior DevOps Engineer"</tspan></text>
    <text class="l" style="animation-delay:2.1s" x="72" y="198"><tspan class="g">      +</tspan> stack = [<tspan class="a">"Terraform"</tspan>, <tspan class="a">"AWS"</tspan>, <tspan class="a">"EKS"</tspan>, <tspan class="a">"Python"</tspan>]</text>
    <text class="l" style="animation-delay:2.5s" x="72" y="220"><tspan class="g">      +</tspan> focus = [<tspan class="a">"IaC"</tspan>, <tspan class="a">"Observability"</tspan>, <tspan class="a">"SRE"</tspan>]</text>
    <text class="l" style="animation-delay:2.9s" x="72" y="242">    }</text>
    <text class="l" style="animation-delay:3.3s" x="72" y="270"><tspan class="w">Plan:</tspan> <tspan class="g">1 to add</tspan>, 0 to change, 0 to destroy.</text>

    <text class="l" style="animation-delay:3.9s" x="72" y="302"><tspan class="g">$</tspan> kubectl get pods -n platform</text>
    <g class="l" style="animation-delay:4.3s">
      <text class="d" x="72" y="324">NAME</text>
      <text class="d" x="300" y="324">READY</text>
      <text class="d" x="380" y="324">STATUS</text>
      <text class="d" x="480" y="324">RESTARTS</text>
      <text class="d" x="590" y="324">AGE</text>
    </g>
    <g class="l" style="animation-delay:4.6s">
      <text x="72" y="346">api-7d9f8c-xk2lp</text>
      <text x="300" y="346">1/1</text>
      <text class="g" x="380" y="346">Running</text>
      <text x="480" y="346">0</text>
      <text x="590" y="346">42d</text>
    </g>
    <g class="l" style="animation-delay:4.9s">
      <text x="72" y="368">worker-5c6b7d-9qwzn</text>
      <text x="300" y="368">1/1</text>
      <text class="g" x="380" y="368">Running</text>
      <text x="480" y="368">0</text>
      <text x="590" y="368">42d</text>
    </g>
    <g class="l" style="animation-delay:5.2s">
      <text x="72" y="390">grafana-agent-0</text>
      <text x="300" y="390">1/1</text>
      <text class="g" x="380" y="390">Running</text>
      <text x="480" y="390">0</text>
      <text x="590" y="390">42d</text>
    </g>
    <text class="l" style="animation-delay:5.5s" x="72" y="412"><tspan class="g">$</tspan> <tspan class="cursor a">▍</tspan></text>
  </g>

  <!-- Painel SLO -->
  <rect x="850" y="40" width="390" height="380" rx="12" fill="#151D2E" stroke="#26324A"/>
  <text x="880" y="76" class="mono lbl">slo / orbit-api</text>
  <circle cx="1196" cy="72" r="4" fill="#7FD99A"/>
  <text x="1208" y="76" class="mono lbl">ok</text>
  <path d="M850 92H1240" stroke="#26324A"/>

  <text x="880" y="152" class="mono" font-size="52" font-weight="700" fill="#D6DEEB">99.95%</text>
  <text x="880" y="176" class="mono lbl">disponibilidade, 30 dias (alvo 99.9%)</text>

  <polyline class="spark" fill="none" stroke="#7DB4FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
    points="880,240 894,236 909,242 923,230 937,234 952,228 966,238 981,226 995,222 1009,232 1024,224 1038,220 1052,228 1067,218 1081,224 1095,216 1110,222 1124,214 1138,220 1153,212 1167,218 1182,210 1196,216 1210,212"/>
  <circle class="dot" cx="1210" cy="212" r="4" fill="#7DB4FF"/>

  <text x="880" y="302" class="mono lbl">error budget restante</text>
  <text x="1210" y="302" text-anchor="end" class="mono lbl">72%</text>
  <rect x="880" y="312" width="330" height="10" rx="5" fill="#26324A"/>
  <rect class="bar" x="880" y="312" width="238" height="10" rx="5" fill="#F2B84B"/>

  <text x="880" y="356" class="mono lbl">p99</text>
  <text x="880" y="380" class="mono val">148ms</text>
  <text x="995" y="356" class="mono lbl">req/s</text>
  <text x="995" y="380" class="mono val">1.2k</text>
  <text x="1100" y="356" class="mono lbl">erros</text>
  <text x="1100" y="380" class="mono val">0.04%</text>
</svg>
